<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jira OhMyGant — UI dev</title>
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <script>
      // Подмена chrome.* — чтобы страницу расширения можно было гонять как обычную веб-страницу.
      window.chrome = {
        storage: {
          local: {
            async get(k) { const v = localStorage.getItem("shim:" + k); return { [k]: v ? JSON.parse(v) : undefined }; },
            async set(o) { for (const [k, v] of Object.entries(o)) localStorage.setItem("shim:" + k, JSON.stringify(v)); }
          }
        },
        permissions: { async contains() { return true; }, async request() { return true; } },
        runtime: { getURL: (p) => p }
      };
    </script>
    <script type="module">
      const html = await (await fetch("../src/app.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      document.body.insertAdjacentHTML("afterbegin", doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, ""));
      await import("../src/js/app.js");
    </script>
  </body>
</html>
