<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jira OhMyGant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span data-i18n="app.title">Jira OhMyGant</span>
        <div class="about" id="about"></div>
      </div>

      <nav class="tabs">
        <!-- «Поиск», «Сводка» и «Настройки» — пиктограммами, чтобы экономить место на верхней плашке; подпись — в подсказке -->
        <button class="tab tab-icon active" data-tab="search" data-i18n-title="tab.search" data-i18n-aria="tab.search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="tab tab-icon" data-tab="summary" data-i18n-title="tab.summary" data-i18n-aria="tab.summary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="20" x2="20" y2="20"></line><rect x="6" y="11" width="3" height="6"></rect><rect x="11" y="7" width="3" height="10"></rect><rect x="16" y="13" width="3" height="4"></rect></svg>
        </button>
        <button class="tab" data-tab="epicPeople" data-i18n="tab.epicPeople"></button>
        <button class="tab" data-tab="people" data-i18n="tab.people"></button>
        <button class="tab" data-tab="team" data-i18n="tab.team"></button>
        <button class="tab tab-icon" data-tab="settings" data-i18n-title="tab.settings" data-i18n-aria="tab.settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <span id="today" class="today" data-i18n-title="app.today"></span>
      </nav>

      <div class="spacer"></div>

      <div class="toolbar">
        <span id="stats" class="muted"></span>
        <span id="lastSync" class="muted"></span>
        <button id="btnRefresh" class="primary" data-i18n="toolbar.refresh"></button>
        <button id="btnReload" data-i18n="toolbar.reload"></button>
        <select id="lang" class="lang" data-i18n-title="lang.label">
          <option value="ru" title="Русский">🇷🇺</option>
          <option value="en" title="English">🇺🇸</option>
        </select>
      </div>
    </header>

    <div id="status" class="status hidden"></div>

    <main>
      <!-- Вкладка 1: поиск и выбор эпиков -->
      <section class="page" id="page-search">
        <p class="hint" data-i18n="search.hint"></p>
        <div class="row">
          <input id="q" type="search" data-i18n-ph="search.placeholder" />
          <button id="btnFind" class="primary" data-i18n="search.find"></button>
          <button id="btnSelectAll" data-i18n="search.selectAll"></button>
          <button id="btnClear" data-i18n="search.clear"></button>
          <div class="spacer"></div>
          <span id="selCount" class="muted"></span>
          <button id="btnSave" class="primary" data-i18n="search.save"></button>
        </div>
        <h3 data-i18n="search.stored"></h3>
        <div id="storedSummary" class="status-summary"></div>
        <div id="storedList" class="list"></div>
        <h3 data-i18n="search.results"></h3>
        <div id="resultsSummary" class="status-summary"></div>
        <div id="results" class="list"></div>
      </section>

      <!-- Вкладка 3: По людям -->
      <section class="page hidden" id="page-people">
        <div class="filter-bar">
          <span id="peopleFilterNote" class="filter-note"></span>
          <span id="peopleEstNote" class="muted small"></span>
        </div>
        <div id="peopleChart"></div>
      </section>

      <!-- Вкладка 2: По эпикам — эпики → исполнители -->
      <!-- Вкладка «Сводка»: статус портфеля после обновления -->
      <section class="page hidden" id="page-summary"></section>

      <section class="page hidden" id="page-epicPeople">
        <div class="filter-bar">
          <label>
            <span data-i18n="gantt.filterAssignee"></span>
            <select id="epicAssignee2"></select>
          </label>
          <span id="personFilterNote" class="filter-note"></span>
          <span id="ganttFilterNote2" class="filter-note"></span>
        </div>
        <div id="epicPeopleChart"></div>
      </section>

      <!-- Вкладка 4: команда — свойства людей -->
      <section class="page hidden" id="page-team"></section>

      <!-- Вкладка 5: настройки -->
      <section class="page hidden" id="page-settings">
        <div class="card">
          <h3 data-i18n="set.connection"></h3>
          <label class="field">
            <span data-i18n="set.baseUrl"></span>
            <input id="baseUrl" type="url" placeholder="https://jira.company.local" />
            <small class="muted" data-i18n="set.baseUrlHint"></small>
          </label>
          <label class="field">
            <span data-i18n="set.pat"></span>
            <input id="pat" type="password" autocomplete="off" />
            <small class="muted" data-i18n="set.patHint"></small>
          </label>
          <div class="row">
            <button id="btnGrant" data-i18n="set.grant"></button>
            <button id="btnTest" data-i18n="set.test"></button>
          </div>
        </div>

        <div class="card">
          <h3 data-i18n="set.fields"></h3>
          <label class="field">
            <span data-i18n="set.estimateField"></span>
            <select id="estimateField">
              <option value="original" data-i18n="set.estimate.original"></option>
              <option value="remaining" data-i18n="set.estimate.remaining"></option>
              <option value="points" data-i18n="set.estimate.points"></option>
            </select>
          </label>
          <label class="field narrow">
            <span data-i18n="set.hoursPerDay"></span>
            <input id="hoursPerDay" type="number" min="1" max="24" step="1" />
          </label>
          <label class="field check">
            <input id="useTempoTeams" type="checkbox" />
            <span data-i18n="set.tempo"></span>
          </label>
          <small class="muted" data-i18n="set.tempoHint"></small>
          <label class="field narrow">
            <span data-i18n="set.flowWeeks"></span>
            <input id="flowWeeks" type="number" min="4" max="52" step="1" />
            <small class="muted" data-i18n="set.flowWeeksHint"></small>
          </label>
          <label class="field">
            <span data-i18n="set.forecastExcludeTypes"></span>
            <input id="forecastExcludeTypes" type="text" placeholder="User Story" />
            <small class="muted" data-i18n="set.forecastExcludeTypesHint"></small>
          </label>
          <div class="row">
            <span class="muted" data-i18n="set.flowDiag"></span>
            <span id="flowDiag" class="muted"></span>
          </div>
          <label class="field narrow">
            <span data-i18n="set.sprintDays"></span>
            <input id="sprintDays" type="number" min="1" max="60" step="1" />
            <small class="muted" data-i18n="set.sprintDaysHint"></small>
          </label>
          <label class="field">
            <span data-i18n="set.doneStatuses"></span>
            <input id="doneStatuses" type="text" placeholder="On Prod, Sign off" />
            <small class="muted" data-i18n="set.doneStatusesHint"></small>
          </label>
          <label class="field">
            <span data-i18n="set.infoSystems"></span>
            <textarea id="infoSystems" rows="4" placeholder="CRM&#10;Billing&#10;Mobile app"></textarea>
            <small class="muted" data-i18n="set.infoSystemsHint"></small>
          </label>
          <label class="field">
            <span data-i18n="set.teams"></span>
            <textarea id="teamsList" rows="4" placeholder="1C&#10;Платформы данных&#10;QA"></textarea>
            <small class="muted" data-i18n="set.teamsHint"></small>
          </label>
          <div class="row">
            <button id="btnDetect" data-i18n="set.detect"></button>
            <span id="detected" class="muted"></span>
          </div>
          <div class="row">
            <label class="field">
              <span data-i18n="set.plannedStart"></span>
              <select id="plannedStartField"></select>
            </label>
            <label class="field">
              <span data-i18n="set.plannedEnd"></span>
              <select id="plannedEndField"></select>
            </label>
          </div>
          <small class="muted" data-i18n="set.plannedHint"></small>
          <div class="row">
            <label class="field">
              <span data-i18n="set.epicAssignee"></span>
              <select id="epicAssigneeField"></select>
            </label>
            <label class="field">
              <span data-i18n="set.epicReporter"></span>
              <select id="epicReporterField"></select>
            </label>
          </div>
          <small class="muted" data-i18n="set.peopleHint"></small>
        </div>

        <div class="card">
          <h3 data-i18n="set.sprints"></h3>
          <label class="field">
            <span data-i18n="set.board"></span>
            <select id="board"></select>
            <small class="muted" data-i18n="set.boardHint"></small>
          </label>
          <div class="row">
            <button id="btnBoards" data-i18n="set.loadBoards"></button>
          </div>
        </div>

        <div class="card">
          <h3 data-i18n="set.summary"></h3>
          <small class="muted" data-i18n="set.summaryHint"></small>
          <div class="sum-settings">
            <label class="field narrow">
              <span data-i18n="set.sum.chanceGreen"></span>
              <input id="sum-chanceGreen" data-sum="chanceGreen" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.chanceYellow"></span>
              <input id="sum-chanceYellow" data-sum="chanceYellow" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.shiftDays"></span>
              <input id="sum-shiftDays" data-sum="shiftDays" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.scopePct"></span>
              <input id="sum-scopePct" data-sum="scopePct" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.scopeAbs"></span>
              <input id="sum-scopeAbs" data-sum="scopeAbs" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.nearWeeks"></span>
              <input id="sum-nearWeeks" data-sum="nearWeeks" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.nearDonePct"></span>
              <input id="sum-nearDonePct" data-sum="nearDonePct" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.stallWeeks"></span>
              <input id="sum-stallWeeks" data-sum="stallWeeks" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.meltWeeks"></span>
              <input id="sum-meltWeeks" data-sum="meltWeeks" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.carrySprints"></span>
              <input id="sum-carrySprints" data-sum="carrySprints" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.idlePct"></span>
              <input id="sum-idlePct" data-sum="idlePct" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.spreadFlow"></span>
              <input id="sum-spreadFlow" data-sum="spreadFlow" type="number" min="0" step="0.5" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.spreadWeeks"></span>
              <input id="sum-spreadWeeks" data-sum="spreadWeeks" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.bottleneckPct"></span>
              <input id="sum-bottleneckPct" data-sum="bottleneckPct" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.noEstimatePct"></span>
              <input id="sum-noEstimatePct" data-sum="noEstimatePct" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.sum.attention"></span>
              <input id="sum-attention" data-sum="attention" type="number" min="0" step="1" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.requestTimeout"></span>
              <input id="requestTimeoutSec" type="number" min="5" max="300" step="1" />
            </label>
          </div>
        </div>

        <div class="card">
          <h3 data-i18n="set.auto"></h3>
          <small class="muted" data-i18n="set.autoHint"></small>
          <label class="field check">
            <input id="autoEnabled" type="checkbox" />
            <span data-i18n="set.autoEnabled"></span>
          </label>
          <div class="row auto-days">
            <label class="check"><input type="checkbox" data-day="1" /><span data-i18n="day.1"></span></label>
            <label class="check"><input type="checkbox" data-day="2" /><span data-i18n="day.2"></span></label>
            <label class="check"><input type="checkbox" data-day="3" /><span data-i18n="day.3"></span></label>
            <label class="check"><input type="checkbox" data-day="4" /><span data-i18n="day.4"></span></label>
            <label class="check"><input type="checkbox" data-day="5" /><span data-i18n="day.5"></span></label>
            <label class="check"><input type="checkbox" data-day="6" /><span data-i18n="day.6"></span></label>
            <label class="check"><input type="checkbox" data-day="7" /><span data-i18n="day.7"></span></label>
          </div>
          <div class="row">
            <label class="field narrow">
              <span data-i18n="set.autoFrom"></span>
              <input id="autoFrom" type="time" />
            </label>
            <label class="field narrow">
              <span data-i18n="set.autoTo"></span>
              <input id="autoTo" type="time" />
            </label>
          </div>
        </div>

        <div class="card">
          <h3 data-i18n="set.config"></h3>
          <small class="muted" data-i18n="set.configHint"></small>
          <div class="row">
            <input id="configFile" type="file" accept="application/json,.json" />
            <button id="btnConfigApply" class="primary" data-i18n="set.configApply"></button>
            <button id="btnConfigExport" data-i18n="set.configExport"></button>
          </div>
          <pre id="configLog" class="config-log hidden"></pre>
        </div>

        <div class="card">
          <h3 data-i18n="set.danger"></h3>
          <div class="row">
            <button id="btnWipe" class="danger" data-i18n="set.wipe"></button>
          </div>
        </div>

        <div class="row">
          <button id="btnSaveSettings" class="primary" data-i18n="set.save"></button>
        </div>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
